<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Glowing Geometric Bot Nodes -->
  <g filter="url(#glow)">
    <!-- Circuit lines connecting nodes -->
    <path d="M18 42L28 22H46L36 42H18Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M22 22L42 22L30 42" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Tech Accent Points -->
  <circle cx="28" cy="22" r="3" fill="#ffffff"/>
  <circle cx="46" cy="22" r="3" fill="#00e599"/>
  <circle cx="18" cy="42" r="3" fill="#00e599"/>
  <circle cx="36" cy="42" r="3" fill="#38bdf8"/>

  <!-- Live Pulse Dot -->
  <circle cx="50" cy="14" r="2.5" fill="#00e599"/>
</svg>